test:
  name: raac-loh-baseline
  description: "RAAC evaluation (baseline): 200 TPS, 70% normal (1-SSTORE) + 30% attack (96KB calldata → .NET LOH). 120s warmup + 300s measure."
  workers:
    type: local
    number: 30
  rounds:
    - label: warmup
      txDuration: 120
      rateControl:
        type: fixed-rate
        opts:
          tps: 200
      workload:
        module: benchmarks/mixedAttackLOH.js
        arguments:
          numContracts: 30
          contractPrefix: SB
    - label: measure
      txDuration: 300
      rateControl:
        type: fixed-rate
        opts:
          tps: 200
      workload:
        module: benchmarks/mixedAttackLOH.js
        arguments:
          numContracts: 30
          contractPrefix: SB
